apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: yes-agent
  description: A minimal test/demo AI agent that always replies "Yes" to every user message.

provides:
  apis:
    - name: yes-agent
      kind: a2a
      ordId: customer.build:apiResource:yes-agent-46192.yes-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
